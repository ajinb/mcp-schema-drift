[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-schema-drift"
version = "1.1.0"
description = "Lock and verify the tool schemas an MCP server advertises: catch total schema loss and drift before your agent does. Companion to the MCP schema-drift study."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["mcp", "model-context-protocol", "schema-drift", "ai-agents", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.18"]

[project.scripts]
mcp-surface = "mcp_schema_drift.cli:entrypoint"

[project.urls]
Homepage = "https://cloudandsre.com"
Source = "https://github.com/ajinb/mcp-schema-drift"
Issues = "https://github.com/ajinb/mcp-schema-drift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_schema_drift"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "LICENSE-DATA", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
